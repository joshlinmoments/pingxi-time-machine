<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>平溪囝仔時光機 · PINGXI TIME MACHINE</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1d3128">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="平溪囝仔時光機">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* ============ Design tokens：墨綠品牌 × 現代高對比 ============ */
:root{
  --ink:#141f19; --pine:#2f4a3d; --pine-deep:#1d3128; --pine-soft:#3f6151;
  --cream:#f4efe0; --paper:#faf6ea; --gold:#ffcf3f; --gold-deep:#e8b220; --brick:#c0432c;
  --line:rgba(20,31,25,.12); --shadow:0 10px 30px rgba(20,31,25,.18); --r:20px;
  --font: "PingFang TC","Noto Sans TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  /* 標題圓體：Apple 系統圓體優先，非 Apple 裝置回退到黑體（絕不用明體） */
  --serif: "Yuanti TC","Yuanti SC","Hiragino Maru Gothic ProN","Yuppy TC","Yuppy SC","PingFang TC","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--cream);background:var(--ink);line-height:1.6;overscroll-behavior-y:none}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:0}
textarea{font-family:inherit}

#app{max-width:480px;margin:0 auto;min-height:100dvh;
  background:radial-gradient(140% 60% at 50% -10%, rgba(63,97,81,.55), transparent 60%),var(--ink);
  position:relative;overflow:hidden;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;animation:fade .45s ease}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 頂部 */
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:12px 16px calc(12px + env(safe-area-inset-top,0));background:linear-gradient(var(--pine-deep),rgba(29,49,40,0))}
#topbar.hidden{display:none}
.brand-mini{font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:1px;color:var(--cream)}
.brand-mini small{display:block;font-family:var(--font);font-weight:400;font-size:9px;letter-spacing:2px;color:var(--gold);opacity:.85}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(244,239,224,.25);transition:.3s}
.dots i.done{background:var(--gold)}
.dots i.now{background:var(--gold);box-shadow:0 0 0 3px rgba(255,207,63,.28)}
.bag-btn{width:40px;height:40px;border-radius:12px;background:rgba(244,239,224,.12);color:var(--cream);
  font-size:18px;display:grid;place-items:center;position:relative}
.bag-btn .n{position:absolute;top:-4px;right:-4px;background:var(--brick);color:#fff;font-size:10px;
  min-width:16px;height:16px;border-radius:9px;display:grid;place-items:center;padding:0 3px;font-weight:700}

/* 封面 */
#cover{justify-content:space-between;padding:0}
.cover-hero{position:relative;flex:1;min-height:52dvh;overflow:hidden;display:flex;align-items:flex-end}
.cover-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(20,31,25,.15) 0%,rgba(20,31,25,.35) 45%,var(--ink) 98%)}
.cover-title{position:relative;z-index:2;padding:0 26px 6px}
.cover-title .zh{font-family:var(--serif);font-weight:700;font-size:44px;line-height:1.05;
  letter-spacing:3px;color:var(--cream);text-shadow:0 2px 18px rgba(0,0,0,.5)}
.cover-title .zh b{color:var(--gold)}
.cover-title .en{font-size:11px;letter-spacing:4px;color:var(--cream);opacity:.8;margin-top:8px}
.cover-body{padding:20px 26px calc(26px + env(safe-area-inset-bottom,0));text-align:center}
.cover-body .tag{display:inline-block;font-size:11px;letter-spacing:3px;color:var(--gold);
  border:1px solid rgba(255,207,63,.5);border-radius:99px;padding:5px 14px;margin-bottom:16px}
.cover-body p{color:rgba(244,239,224,.75);font-size:14px;margin:0 0 20px}
.cta{width:100%;padding:17px;border-radius:16px;background:var(--gold);color:var(--pine-deep);font-weight:800;
  font-size:17px;letter-spacing:2px;box-shadow:0 8px 24px rgba(255,207,63,.3);transition:transform .12s ease, box-shadow .2s}
.cta:active{transform:translateY(2px) scale(.99);box-shadow:0 3px 12px rgba(255,207,63,.3)}
.cta.ghost{background:transparent;color:var(--cream);border:1.5px solid rgba(244,239,224,.35);box-shadow:none}

/* 對話舞台 */
.stage-wrap{flex:1;display:flex;flex-direction:column;padding:4px 16px 0}
.stage-head{padding:6px 2px 14px}
.stage-head .no{font-family:var(--serif);font-size:13px;color:var(--gold);letter-spacing:2px;font-weight:700}
.stage-head .zh{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:1px;color:var(--cream);line-height:1.2}
.stage-head .en{font-size:10px;letter-spacing:3px;color:rgba(244,239,224,.55);margin-top:3px;text-transform:uppercase}
.chat{flex:1;display:flex;flex-direction:column;gap:12px;padding:6px 0 8px}
.msg{display:flex;gap:10px;align-items:flex-end;opacity:0;transform:translateY(10px);animation:pop .35s ease forwards}
@keyframes pop{to{opacity:1;transform:none}}
.avatar{width:40px;height:40px;border-radius:50%;flex:0 0 40px;background:var(--gold);display:grid;
  place-items:center;overflow:hidden;box-shadow:var(--shadow);border:2px solid var(--gold)}
.avatar img{width:100%;height:100%;object-fit:cover}
.bubble{background:var(--paper);color:var(--ink);padding:11px 14px;border-radius:16px 16px 16px 4px;
  font-size:15px;max-width:78%;box-shadow:0 4px 14px rgba(0,0,0,.18);white-space:pre-line}
.bubble.narr{background:rgba(244,239,224,.08);color:rgba(244,239,224,.82);font-style:italic;border-radius:12px;
  font-size:13.5px;max-width:100%;box-shadow:none;border:1px dashed rgba(244,239,224,.18)}
.name{font-size:11px;color:var(--gold);margin:0 0 3px 48px;letter-spacing:1px}

/* 系統訊息（獲得道具 / 圖鑑 / 打卡） */
.sys{align-self:center;text-align:center;font-size:13px;letter-spacing:.5px;color:var(--cream);
  background:rgba(63,97,81,.28);border:1px solid rgba(244,239,224,.18);border-radius:99px;padding:8px 16px;max-width:92%;
  opacity:0;transform:translateY(8px);animation:pop .35s ease forwards}
.sys.loot{background:linear-gradient(120deg,rgba(255,207,63,.22),rgba(232,178,32,.12));border-color:rgba(255,207,63,.5);
  color:var(--cream);font-weight:600;border-radius:16px;padding:12px 16px;font-size:14px}
.sys.loot b{color:var(--gold)}

/* 場景卡 */
.scene{margin:4px 0;border-radius:18px;overflow:hidden;position:relative;box-shadow:var(--shadow);
  opacity:0;transform:scale(.96);animation:pop .5s ease forwards}
.scene img{width:100%;aspect-ratio:16/10;object-fit:cover}
.scene .ph{width:100%;aspect-ratio:16/10;display:grid;place-items:center;text-align:center;padding:20px;
  background:linear-gradient(135deg,var(--pine-soft),var(--pine-deep));position:relative}
.scene .ph .ic{font-size:40px}.scene .ph .lb{font-size:12px;color:rgba(244,239,224,.7);margin-top:8px;letter-spacing:1px}
.scene .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 12px;
  background:linear-gradient(transparent,rgba(20,31,25,.85));font-size:12px;letter-spacing:1px}
.scene .cap b{color:var(--gold)}
.scene .aitag{position:absolute;top:10px;left:10px;font-size:9px;letter-spacing:1px;
  background:rgba(20,31,25,.6);color:var(--gold);padding:3px 8px;border-radius:99px;backdrop-filter:blur(4px)}

/* 互動卡 */
.task{background:rgba(244,239,224,.08);border:1px solid var(--line);border-left:4px solid var(--gold);
  border-radius:14px;padding:14px 15px;margin:6px 0;opacity:0;transform:translateY(10px);animation:pop .4s ease forwards}
.task h4{margin:0 0 8px;font-size:12px;letter-spacing:2px;color:var(--gold)}
.q{font-size:15px;font-weight:600;margin:2px 0 10px;color:var(--cream);white-space:pre-line}
.field{margin:10px 0}
.field label{display:block;font-size:13px;color:rgba(244,239,224,.82);margin-bottom:6px;letter-spacing:.5px;white-space:pre-line}
.field input,.field textarea{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid rgba(244,239,224,.2);
  background:rgba(244,239,224,.06);color:var(--cream);font-size:16px;font-family:inherit}
.field textarea{min-height:78px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--gold);background:rgba(255,207,63,.06)}
.field input.bad{border-color:var(--brick);background:rgba(192,67,44,.1)}
.reveal{background:rgba(255,207,63,.1);border:1px dashed rgba(255,207,63,.5);border-radius:12px;
  padding:11px 13px;margin-top:10px;font-size:13.5px;color:var(--cream)}
.reveal b{color:var(--gold)}
.reveal.wrong{background:rgba(192,67,44,.15);border-color:rgba(192,67,44,.55)}
.reveal.wrong b{color:#ff9c85}
.reveal.right{background:rgba(127,220,160,.14);border-color:rgba(127,220,160,.5)}
.choice-btns{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.choice-btns button{text-align:left;background:rgba(244,239,224,.08);border:1px solid rgba(244,239,224,.22);
  color:var(--cream);padding:12px 14px;border-radius:12px;font-size:14.5px;line-height:1.45}
.choice-btns button:active{background:rgba(255,207,63,.12);border-color:var(--gold)}

/* 使用道具卡 */
.usecard{background:linear-gradient(120deg,rgba(192,67,44,.16),rgba(63,97,81,.16));border:1px solid rgba(255,207,63,.4);
  border-radius:14px;padding:14px 15px;margin:6px 0;opacity:0;transform:translateY(10px);animation:pop .4s ease forwards}
.usecard .uh{font-size:12px;letter-spacing:2px;color:var(--gold);margin-bottom:8px}

/* 拍照 / 趣味相框 */
.photo-cap{background:rgba(63,97,81,.22);border:1px dashed rgba(244,239,224,.28);border-radius:14px;
  padding:12px 13px;margin:6px 0 4px}
.photo-cap.frame{border-style:solid;border-color:rgba(255,207,63,.5);background:rgba(255,207,63,.08)}
.photo-cap .pc-head{font-size:12px;letter-spacing:1px;color:var(--gold);margin-bottom:4px}
.photo-cap .pc-prompt{font-size:13.5px;color:rgba(244,239,224,.88);margin-bottom:10px}
.photo-thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;margin-bottom:10px;border:2px solid var(--gold)}
.pc-btn{display:block;text-align:center;padding:12px;border-radius:12px;background:rgba(244,239,224,.12);
  color:var(--cream);font-weight:700;font-size:14px;border:1px solid rgba(244,239,224,.25);margin-bottom:8px}
.pc-btn:active{transform:translateY(1px)}

.btn{width:100%;padding:15px;border-radius:14px;background:var(--gold);color:var(--pine-deep);font-weight:800;
  font-size:16px;letter-spacing:2px;margin-top:8px;transition:transform .12s}
.btn:active{transform:translateY(2px)}.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;color:var(--cream);border:1.5px solid rgba(244,239,224,.3)}
.btn.brick{background:var(--brick);color:#fff}
.btn.sm{padding:11px;font-size:14px;letter-spacing:1px}

.next-hint{background:var(--pine-deep);border-radius:14px;padding:14px 15px;margin:10px 0 4px;border:1px solid var(--line)}
.next-hint .k{font-size:11px;letter-spacing:2px;color:var(--gold);margin-bottom:5px}
.next-hint .v{font-size:15px;color:var(--cream);font-family:var(--serif)}
.next-hint .map-link{display:block;margin-top:10px;text-align:center;text-decoration:none;
  background:rgba(255,207,63,.14);border:1px solid rgba(255,207,63,.5);color:var(--gold);
  border-radius:10px;padding:10px;font-size:14px;font-weight:700}
.next-hint .map-link:active{background:rgba(255,207,63,.24)}
.pad{padding:12px 16px calc(20px + env(safe-area-inset-bottom,0))}
.hidden{display:none!important}

/* 背包 / 圖鑑 / 相簿 抽屜 */
#bag{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center}
#bag.on{display:flex}
#bag .bg{position:absolute;inset:0;background:rgba(10,16,12,.6);backdrop-filter:blur(3px)}
#bag .sheet{position:relative;width:100%;max-width:480px;background:var(--pine-deep);border-radius:24px 24px 0 0;
  padding:18px 20px calc(26px + env(safe-area-inset-bottom,0));animation:up .3s ease;max-height:84dvh;overflow:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.bag-tabs{display:flex;gap:6px;margin-bottom:14px;background:rgba(244,239,224,.08);border-radius:12px;padding:4px}
.bag-tabs button{flex:1;padding:9px;border-radius:9px;background:transparent;color:rgba(244,239,224,.7);font-size:13px;font-weight:700;letter-spacing:1px}
.bag-tabs button.on{background:var(--gold);color:var(--pine-deep)}
.bag-pane{display:none}.bag-pane.on{display:block}
.bp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bp-item{display:flex;gap:10px;align-items:center;background:rgba(244,239,224,.06);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px}
.bp-item .emo{font-size:26px;flex:0 0 auto}
.bp-item img.emo{width:42px;height:42px;object-fit:contain}
.sys.loot .loot-img{height:78px;object-fit:contain;margin-bottom:4px}
.bp-item .nm{font-size:14px;font-weight:700;color:var(--cream)}
.bp-item .st{font-size:11px;color:var(--gold)}
.bp-item.used{opacity:.55}.bp-item.used .st{color:rgba(244,239,224,.5)}
.dex-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dex-cell{background:rgba(244,239,224,.06);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.dex-cell .emo{font-size:32px;height:44px;display:grid;place-items:center;margin:0 auto}
.dex-cell .emo img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
.dex-cell .nm{font-size:14px;font-weight:700;color:var(--gold);margin-top:4px}
.dex-cell .ds{font-size:11px;color:rgba(244,239,224,.7);margin-top:4px;line-height:1.4}
.dex-cell.lock{opacity:.5}.dex-cell.lock .nm{color:rgba(244,239,224,.6)}
.album-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.album-cell{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;
  background:linear-gradient(135deg,var(--pine-soft),var(--pine-deep));border:1px solid var(--line)}
.album-cell img{width:100%;height:100%;object-fit:cover}
.album-cell .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  color:rgba(244,239,224,.5);font-size:12px;padding:8px}
.album-cell .tag{position:absolute;left:0;right:0;bottom:0;padding:12px 8px 6px;font-size:10px;letter-spacing:.5px;
  background:linear-gradient(transparent,rgba(20,31,25,.85));color:var(--cream)}
#bag h3{margin:0 0 12px;font-family:var(--serif);font-size:20px}

/* 小小遊記 + 明信片 */
#finale{padding:24px 18px calc(30px + env(safe-area-inset-bottom,0));overflow:auto}
.jb-head{text-align:center;margin-bottom:18px}
.jb-head .seal{font-size:40px}
.jb-head h2{font-family:var(--serif);font-size:26px;margin:6px 0 2px;color:var(--cream)}
.jb-head .en{font-size:10px;letter-spacing:3px;color:var(--gold)}
.jb-head .who{margin-top:10px;font-size:14px;color:rgba(244,239,224,.85)}
.jb-head .who b{color:var(--gold);font-size:20px;font-family:var(--serif)}
.jb-dex{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.jb-dex span{font-size:22px}
.jb-card{background:rgba(244,239,224,.06);border:1px solid var(--line);border-left:4px solid var(--gold);
  border-radius:14px;padding:14px 15px;margin-bottom:12px}
.jb-card .pl{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--cream)}
.jb-card .pl small{font-family:var(--font);font-size:11px;color:var(--gold);margin-left:6px;letter-spacing:1px}
.jb-card .story{font-size:13px;color:rgba(244,239,224,.75);font-style:italic;margin:6px 0 10px}
.jb-photos{display:flex;gap:8px;overflow-x:auto;margin-bottom:8px;padding-bottom:2px}
.jb-photos img{height:110px;border-radius:10px;border:2px solid rgba(255,207,63,.5);flex:0 0 auto}
.jb-note{background:rgba(255,207,63,.08);border:1px dashed rgba(255,207,63,.4);border-radius:10px;padding:9px 12px;margin-top:6px}
.jb-note .qp{font-size:11px;color:var(--gold);margin-bottom:3px}
.jb-note .an{font-size:14px;color:var(--cream)}
.postcard-wrap{width:100%;margin-top:18px}
.postcard-wrap h3{font-family:var(--serif);font-size:18px;margin:0 0 4px}
.postcard-wrap .sub{font-size:12px;color:rgba(244,239,224,.6);margin-bottom:12px}
#postcard{width:100%;border-radius:14px;box-shadow:var(--shadow);background:var(--pine-deep)}

/* 貼紙編輯器 */
#editor{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;background:rgba(10,16,12,.95);
  padding:calc(14px + env(safe-area-inset-top,0)) 14px calc(16px + env(safe-area-inset-bottom,0));max-width:480px;margin:0 auto}
#editor.on{display:flex}
.ed-top{text-align:center;margin-bottom:10px}
.ed-title{font-family:var(--serif);font-size:20px;color:var(--cream)}
.ed-hint{font-size:11px;color:rgba(244,239,224,.6);margin-top:3px}
.ed-canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.ed-frame{position:relative;width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;
  border:3px solid var(--gold);background:#000;touch-action:none}
#edPhoto{width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none}
.ed-sticker{position:absolute;touch-action:none;cursor:move}
.ed-sticker img{width:100%;height:100%;pointer-events:none;user-select:none;-webkit-user-drag:none;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.ed-sticker .del{position:absolute;top:-11px;left:-11px;width:24px;height:24px;border-radius:50%;background:var(--brick);
  color:#fff;font-size:13px;display:grid;place-items:center;border:2px solid #fff}
.ed-sticker .rz{position:absolute;right:-11px;bottom:-11px;width:24px;height:24px;border-radius:50%;background:var(--gold);
  color:var(--pine-deep);font-size:12px;display:grid;place-items:center;border:2px solid #fff;touch-action:none}
.ed-tray{display:flex;gap:8px;overflow-x:auto;padding:12px 2px;margin-top:6px}
.ed-tray button{flex:0 0 auto;width:66px;height:66px;border-radius:12px;background:rgba(244,239,224,.1);
  border:1px solid rgba(244,239,224,.25);display:grid;place-items:center;padding:7px}
.ed-tray button img{max-width:100%;max-height:100%;object-fit:contain}
.ed-actions{display:flex;gap:10px}
.ed-actions .btn{margin-top:0}
</style>
</head>
<body>
<div id="app">

  <div id="topbar" class="hidden">
    <div class="brand-mini">平溪囝仔時光機<small>PINGXI TIME MACHINE</small></div>
    <div class="dots" id="dots"></div>
    <button class="bag-btn" onclick="openBag()">🎒<span class="n hidden" id="bagN">0</span></button>
  </div>

  <!-- 封面 -->
  <section class="screen on" id="cover">
    <div class="cover-hero">
      <img id="coverImg" alt="回到平溪那年">
      <div class="cover-title">
        <div class="zh">平溪<b>囝仔</b>時光機</div>
        <div class="en">PINGXI TIME MACHINE</div>
      </div>
    </div>
    <div class="cover-body">
      <span class="tag">平溪老街走讀遊戲</span>
      <p>跟著平溪最強嚮導「小葉」，一站一站走進老街，<br>用五感、相機與趣味相框，穿越回到平溪的那些年。</p>
      <button class="cta" onclick="go('intro')">開始走讀 →</button>
    </div>
  </section>

  <!-- 關卡舞台 -->
  <section class="screen" id="play">
    <div class="stage-wrap">

function load(){try{const o=JSON.parse(localStorage.getItem(SAVE));return o&&o.album&&o.items?o:fresh();}catch(e){return fresh();}}

function save(){try{localStorage.setItem(SAVE,JSON.stringify(S));}catch(e){}}

function go(where){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('topbar').classList.toggle('hidden', where==='cover');
  if(where==='cover'){document.getElementById('cover').classList.add('on');return;}
  if(where==='intro'){ S.stage=Math.max(S.stage,1); save(); renderStage(); return; }
  if(where==='finale'){ document.getElementById('finale').classList.add('on'); renderJourney(); buildPostcard(); renderDots(); window.scrollTo(0,0); return; }
}

/* ---------- 進度點 + 收藏數 ---------- */
function renderDots(){
  const d=document.getElementById('dots');d.innerHTML='';
  for(let i=1;i<=7;i++){const el=document.createElement('i');
    if(i<S.stage||S.done)el.className='done'; if(i===S.stage&&!S.done)el.className='now'; d.appendChild(el);}
  const n=Object.keys(S.dex).length;const bn=document.getElementById('bagN');
  bn.textContent=n;bn.classList.toggle('hidden',n===0);
}

/* ---------- 舞台渲染 ---------- */
function renderStage(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('play').classList.add('on');
  document.getElementById('topbar').classList.remove('hidden');
  const st=STAGES[S.stage-1];
  document.getElementById('sNo').textContent="第 "+st.n+" 關 / STAGE "+st.n;
  document.getElementById('sZh').textContent=st.zh;
  document.getElementById('sEn').textContent=st.en;
  const chat=document.getElementById('chat');chat.innerHTML='';
  renderDots();
  playBeat(st,0,chat);
  window.scrollTo(0,0);
}

/* ---------- 逐段引擎 ---------- */
let PLAY_QUEUE=[];
function nm(txt){return (txt||'').replace(/\{name\}/g, S.codename||'朋友');}
function appendYe(chat,text){
  const label=document.createElement('div');label.className='name';label.textContent='小葉';chat.appendChild(label);
  const row=document.createElement('div');row.className='msg';
  row.innerHTML=`<div class="avatar"><img src="${XIAOYE}" alt="小葉"></div><div class="bubble">${nm(text)}</div>`;
  chat.appendChild(row);scrollChat();
}
function appendNarr(chat,text){
  const row=document.createElement('div');row.className='msg';
  row.innerHTML=`<div class="bubble narr">${nm(text)}</div>`;chat.appendChild(row);scrollChat();
}
function appendSys(chat,html,loot){
  const el=document.createElement('div');el.className='sys'+(loot?' loot':'');el.innerHTML=html;chat.appendChild(el);scrollChat();
}
function showAdvance(cont){
  const adv=document.getElementById('advance');
  adv.classList.remove('hidden');adv.textContent='繼續 ▾';
  PLAY_QUEUE=[cont];
}
function hideAdvance(){document.getElementById('advance').classList.add('hidden');}
function advance(){ if(PLAY_QUEUE.length){const f=PLAY_QUEUE.shift();f();} }

function playBeat(st,i,chat){
  if(i>=st.beats.length){ endStage(st,chat); return; }
  const b=st.beats[i];
  const cont=()=>playBeat(st,i+1,chat);
  switch(b.t){
    case 'ye': appendYe(chat,b.x); showAdvance(cont); break;
    case 'narr': appendNarr(chat,b.x); showAdvance(cont); break;
    case 'scene': showScene(st,chat); showAdvance(cont); break;
    case 'get':
      S.items[b.item]='have'; save();
      appendSys(chat,`<img class="loot-img" src="${ITEM_IMG[b.item]||''}" alt="" onerror="this.style.display='none'"><div>獲得道具　<b>${b.item}</b></div>`,true);
      if(b.x) appendNarr(chat,b.x);
      renderDots(); showAdvance(cont); break;
    case 'dex':
      if(!S.dex[b.who]){S.dex[b.who]=true;save();}
      appendSys(chat,`📖 圖鑑 +1　<b style="color:var(--gold)">${(DEX[b.who]||{}).name||b.who}</b>`);
      renderDots(); showAdvance(cont); break;
    case 'stamp':
      if(!S.stamps.includes(st.n)){S.stamps.push(st.n);save();renderDots();}
      appendSys(chat,`🎉 「${st.place}」打卡成功 ✓`); showAdvance(cont); break;
    case 'input': hideAdvance(); renderInput(b,st,chat,cont); break;
    case 'open': hideAdvance(); renderOpen(b,st,chat,cont); break;
    case 'choice': hideAdvance(); renderChoice(b,st,chat,cont); break;
    case 'photo': hideAdvance(); renderPhoto(b,st,chat,cont); break;
    case 'use': hideAdvance(); renderUse(b,st,chat,cont); break;
    case 'final': hideAdvance(); renderFinalBtn(chat); break;
    default: showAdvance(cont);
  }
}
function showScene(st,chat){
  const sc=document.createElement('div');sc.className='scene';const img=SCENE_IMG[st.n];
  sc.innerHTML = img
    ? `<span class="aitag">AI 時光機影像</span><img src="${img}" alt=""><div class="cap"><b>${st.place}</b> · 那年</div>`
    : `<span class="aitag">AI 影像</span><div class="ph"><div><div class="ic">🕰️</div><div class="lb">${st.place} · 那年</div></div></div>`;
  chat.appendChild(sc);scrollChat();
}

/* ---- 互動：輸入題 ---- */
function renderInput(b,st,chat,cont){
  const box=document.createElement('div');box.className='task';
  box.innerHTML=`<h4>任務 MISSION</h4>
    <div class="field"><label>${b.label}</label><input data-k="${b.key}" placeholder="${b.ph||''}"></div>
    <button class="btn">送出</button>`;
  chat.appendChild(box);
  const input=box.querySelector('input'); if(S.answers[b.key])input.value=S.answers[b.key];
  box.querySelector('.btn').onclick=()=>{
    const val=(input.value||'').trim(); S.answers[b.key]=val;
    if(b.key==='codename'){ if(!val){alert('先幫自己取個探險代號吧！');return;} S.codename=val; }
    if(b.accept&&b.confirmed){
      const ok=matchOne(val,b.accept);
      input.classList.toggle('bad',!ok);
      const oldW=box.querySelector('.reveal.wrong'); if(oldW)oldW.remove();
      if(!ok){
        TRIES[b.key]=(TRIES[b.key]||0)+1;
        const msg=TRIES[b.key]>=3
          ? `別急，小葉偷偷告訴你：答案是「<b>${b.accept[0]}</b>」，再輸入一次吧！`
          : `嗯～好像不太對喔 🤔 ${b.tip?('提示：'+b.tip+'。'):''}答對才能過關！`;
        box.insertAdjacentHTML('beforeend',`<div class="reveal wrong">❌ ${msg}</div>`);scrollChat();return;
      }
    }
    save(); input.disabled=true; box.querySelector('.btn').classList.add('hidden');
    const oldW=box.querySelector('.reveal.wrong'); if(oldW)oldW.remove();
    if(b.accept&&b.confirmed) box.insertAdjacentHTML('beforeend',`<div class="reveal right">✅ 答對了！</div>`);
    if(b.warm) appendYe(chat,b.warm);
    cont();
  };
  scrollChat();
}

/* ---- 互動：拍照 / 趣味相框 ---- */
function renderPhoto(b,st,chat,cont){
  const have=S.album[b.slot];
  const box=document.createElement('div');box.className='photo-cap frame';
  box.innerHTML=`
    <div class="pc-head">📸 拍照＋貼貼紙（選拍，別客氣多拍幾張！）</div>
    <div class="pc-prompt">${b.prompt}</div>
    <img class="photo-thumb ${have?'':'hidden'}" src="${have?have.data:''}" alt="">
    <label class="pc-btn"><input type="file" accept="image/*" capture="environment" hidden>
      <span class="lbl">${have?'重拍 / 換一張':'開啟相機 · 拍一張'}</span></label>
    <button class="btn sm">${have?'繼續 →':'拍好了 / 略過 →'}</button>`;
  chat.appendChild(box);
  const fileInput=box.querySelector('input[type=file]');
  const thumb=box.querySelector('.photo-thumb');
  const lbl=box.querySelector('.lbl');
  const goBtn=box.querySelector('.btn');
  fileInput.onchange=()=>handlePhoto(fileInput,b,st,thumb,lbl,goBtn);
  goBtn.onclick=()=>{
    box.querySelector('.pc-btn').style.display='none';
    goBtn.classList.add('hidden');
    cont();
  };
  scrollChat();
}
function handlePhoto(input,b,st,thumb,lbl,goBtn){
  const f=input.files&&input.files[0]; if(!f) return;
  const url=URL.createObjectURL(f); const img=new Image();
  img.onload=()=>{
    const max=1200; let w=img.naturalWidth,h=img.naturalHeight;
    const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    const base=c.toDataURL('image/jpeg',0.82);
    URL.revokeObjectURL(url);
    openEditor(base, b.slot, b.label, (finalData)=>{
      S.album[b.slot]={data:finalData,label:b.label,stage:st.n}; save(); renderDots();
      if(thumb){thumb.src=finalData;thumb.classList.remove('hidden');}
      if(lbl)lbl.textContent='重拍 / 換一張';
      if(goBtn)goBtn.textContent='繼續 →';
    });
  };
  img.onerror=()=>{alert('照片讀取失敗，換一張試試看');URL.revokeObjectURL(url);};
  img.src=url;
}

/* ---------- 貼紙編輯器 ---------- */
let EDITOR=null;
function openEditor(base, slot, label, onDone){
  EDITOR={slot,label,onDone,base,stickers:[]};
  const frame=document.getElementById('edFrame');
  [...frame.querySelectorAll('.ed-sticker')].forEach(e=>e.remove());
  document.getElementById('edPhoto').src=base;
  const tray=document.getElementById('edTray');
  tray.innerHTML=stickersFor(slot).map(id=>{const s=STICKERS[id];
    return `<button data-id="${id}" title="${s.name}"><img src="${s.img}" alt="${s.name}" onerror="this.parentElement.style.display='none'"></button>`;}).join('');
  tray.querySelectorAll('button').forEach(btn=>btn.onclick=()=>addSticker(btn.dataset.id));
  document.getElementById('editor').classList.add('on');
}
function addSticker(id){
  const frame=document.getElementById('edFrame');const s=STICKERS[id];if(!s)return;
  const el=document.createElement('div');el.className='ed-sticker';
  el.dataset.id=id;el.dataset.cx='0.5';el.dataset.cy='0.5';el.dataset.scale='0.32';
  el.innerHTML=`<img src="${s.img}" alt=""><div class="del">✕</div><div class="rz">⤡</div>`;
  frame.appendChild(el);
  const img=el.querySelector('img');
  if(img.complete)layoutSticker(el); else img.addEventListener('load',()=>layoutSticker(el));
  attachStickerDrag(el);
  EDITOR.stickers.push(el);
}
function layoutSticker(el){
  const frame=document.getElementById('edFrame');const fw=frame.clientWidth,fh=frame.clientHeight;
  const img=el.querySelector('img');
  const w=parseFloat(el.dataset.scale)*fw;
  const nat=(img.naturalWidth&&img.naturalHeight)?img.naturalHeight/img.naturalWidth:1;
  const h=w*nat;
  el.style.width=w+'px';el.style.height=h+'px';
  el.style.left=(parseFloat(el.dataset.cx)*fw - w/2)+'px';
  el.style.top=(parseFloat(el.dataset.cy)*fh - h/2)+'px';
}
function attachStickerDrag(el){
  const frame=document.getElementById('edFrame');
  el.addEventListener('pointerdown',e=>{
    if(e.target.classList.contains('del')||e.target.classList.contains('rz'))return;
    e.preventDefault();frame.appendChild(el);
    const r=frame.getBoundingClientRect();const sx=e.clientX,sy=e.clientY;
    const cx0=parseFloat(el.dataset.cx),cy0=parseFloat(el.dataset.cy);
    const move=ev=>{const dx=(ev.clientX-sx)/r.width,dy=(ev.clientY-sy)/r.height;
      el.dataset.cx=Math.min(1,Math.max(0,cx0+dx));el.dataset.cy=Math.min(1,Math.max(0,cy0+dy));layoutSticker(el);};
    const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);};
    document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
  });
  el.querySelector('.del').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();
    EDITOR.stickers=EDITOR.stickers.filter(x=>x!==el);el.remove();});
  el.querySelector('.rz').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();
    const r=frame.getBoundingClientRect();
    const cx=parseFloat(el.dataset.cx)*r.width+r.left, cy=parseFloat(el.dataset.cy)*r.height+r.top;
    const move=ev=>{const dist=Math.hypot(ev.clientX-cx,ev.clientY-cy);
      let scale=(dist*2)/r.width;scale=Math.min(1.3,Math.max(0.1,scale));el.dataset.scale=scale;layoutSticker(el);};
    const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);};
    document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
  });
}
function editorCancel(){finishEditor(EDITOR.base);}
async function editorDone(){finishEditor(await composeEditor());}
function finishEditor(dataUrl){
  const cb=EDITOR&&EDITOR.onDone;
  document.getElementById('editor').classList.remove('on');
  EDITOR=null;
  if(cb)cb(dataUrl);
}
async function composeEditor(){
  const W=1000,H=750;const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
  const base=await loadImg(EDITOR.base);if(base)drawCover(ctx,base,0,0,W,H);
  for(const el of EDITOR.stickers){
    const im=await loadImg(STICKERS[el.dataset.id].img);if(!im)continue;
    const w=parseFloat(el.dataset.scale)*W, h=w*(im.height/im.width);
    const cx=parseFloat(el.dataset.cx)*W, cy=parseFloat(el.dataset.cy)*H;
    ctx.drawImage(im,cx-w/2,cy-h/2,w,h);
  }
  const bh=70;ctx.fillStyle='rgba(29,49,40,.82)';ctx.fillRect(0,H-bh,W,bh);
  ctx.fillStyle='#ffcf3f';ctx.font='700 34px '+RFONT;ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(EDITOR.label||'平溪囝仔時光機',30,H-bh/2);
  ctx.textAlign='right';ctx.fillStyle='rgba(244,239,224,.9)';ctx.font='600 22px system-ui';
  ctx.fillText('平溪囝仔時光機',W-28,H-bh/2);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  return c.toDataURL('image/jpeg',0.85);
}

/* ---------- 答案判定 ---------- */
const TRIES={};
const NORM=s=>(s||'').replace(/[\s，,。.、·・「」（）()／/　]/g,'').trim();
function matchOne(val,accept){const v=NORM(val);if(!v)return false;
  return accept.some(a=>{const n=NORM(a);return n&&(v===n||v.includes(n));});}

/* ---------- 關卡收尾 ---------- */
function endStage(st,chat){
  if(!S.stamps.includes(st.n)){S.stamps.push(st.n);save();renderDots();}
  hideAdvance();
  const next=STAGES[st.n]; // 下一關（st.n 為目前關號，陣列 0-based 即下一關）
  if(st.hint){
    const nh=document.createElement('div');nh.className='next-hint';
    let inner=`<div class="k">🔎 下一站</div><div class="v">「${st.hint}」</div>`;
    if(next){const q=encodeURIComponent(next.map||('平溪 '+next.place));
      inner+=`<a class="map-link" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">🗺️ 開啟地圖帶我去「${next.place}」</a>`;}
    nh.innerHTML=inner;chat.appendChild(nh);
  }
  const cont=document.createElement('div');cont.style.padding='6px 0 0';
  cont.innerHTML=`<button class="btn">前往第 ${st.n+1} 關 →</button>`;chat.appendChild(cont);
  cont.querySelector('.btn').onclick=nextStage;
  scrollChat(true);
}
function renderFinalBtn(chat){
  if(!S.stamps.includes(7))S.stamps.push(7);
  S.done=true;save();renderDots();
  const c=document.createElement('div');c.style.padding='10px 0 0';
  c.innerHTML=`<button class="btn brick">領取我的平溪小小遊記 📖</button>`;chat.appendChild(c);
  c.querySelector('.btn').onclick=()=>go('finale');
  scrollChat(true);
}
function nextStage(){S.stage++;save();renderStage();}
function scrollChat(){requestAnimationFrame(()=>{window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});});}

/* ---------- 小小遊記 ---------- */
function renderJourney(){
  document.getElementById('jbName').textContent=S.codename||'平溪小旅人';
  const d=new Date();
  document.getElementById('jbDate').textContent=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');

  document.getElementById('jbDex').innerHTML=order.filter(k=>S.dex[k]).map(k=>`<span title="${DEX[k].name}">${DEX[k].img?'🧑':(DEX[k].emo||'⭐')}</span>`).join('');
  const book=document.getElementById('journeyBook');book.innerHTML='';
  STAGES.forEach(st=>{
    const photos=Object.entries(S.album).filter(([slot,p])=>p&&p.stage===st.n);
    const notes=Object.values(S.journal).filter(j=>j.stage===st.n);
    if(!photos.length&&!notes.length) return;
    let html=`<div class="jb-card"><div class="pl">${st.place}<small>STAGE ${st.n}</small></div>
      <div class="story">${st.story||''}</div>`;
    if(photos.length){html+=`<div class="jb-photos">`+photos.map(([slot,p])=>`<img src="${p.data}" alt="">`).join('')+`</div>`;}
    notes.forEach(nn=>{html+=`<div class="jb-note"><div class="qp">${nn.prompt}</div><div class="an">${escapeHtml(nn.text)}</div></div>`;});
    html+=`</div>`; book.insertAdjacentHTML('beforeend',html);
  });
  if(!book.innerHTML){book.innerHTML=`<div class="jb-card"><div class="story">這趟旅程還沒留下文字或照片——回去走一遍，邊玩邊記錄，就會長出你專屬的小小遊記囉！</div></div>`;}
}
function escapeHtml(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---------- 明信片（Canvas 3×3） ---------- */
function loadImg(src){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});}
function drawCover(ctx,img,x,y,w,h){
  const ir=img.width/img.height, r=w/h; let sw,sh,sx,sy;
  if(ir>r){sh=img.height;sw=sh*r;sx=(img.width-sw)/2;sy=0;}
  else{sw=img.width;sh=sw/r;sx=0;sy=(img.height-sh)/2;}
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);}else{
    ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
}
async function buildPostcard(){
  const c=document.getElementById('postcard');const ctx=c.getContext('2d');
  const W=1000,H=1060;c.width=W;c.height=H;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2f4a3d');g.addColorStop(1,'#16241c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#faf6ea';roundRect(ctx,34,34,W-68,H-68,32);ctx.fill();
  ctx.textAlign='center';ctx.fillStyle='#2f4a3d';
  ctx.font='700 66px '+RFONT;ctx.fillText('平溪囝仔時光機',W/2,132);
  ctx.font='600 20px system-ui';ctx.fillStyle='#8a7a55';ctx.fillText('PINGXI TIME MACHINE',W/2,168);
  const slots=[["1","平溪車站"],["2","成盈利"],["3","新建成"],["4","觀音巖"],["5a","八仙洞"],["5b","防空洞"],["5c","平安鐘"],["6","美雲布藝"],["7","合照"]];
  const cols=3,gap=18,mx=60,top=200;
  const cw=(W-mx*2-gap*(cols-1))/cols, ch=cw*0.75;
  for(let i=0;i<slots.length;i++){
    const col=i%cols,row=(i/cols|0);
    const x=mx+col*(cw+gap), y=top+row*(ch+gap);
    ctx.save();roundRect(ctx,x,y,cw,ch,14);ctx.clip();
    const p=S.album[slots[i][0]];
    if(p){const im=await loadImg(p.data); if(im){drawCover(ctx,im,x,y,cw,ch);}else{fillEmpty(ctx,x,y,cw,ch);} }
    else{fillEmpty(ctx,x,y,cw,ch);}
    ctx.restore();
    ctx.strokeStyle='#e6dcc2';ctx.lineWidth=3;roundRect(ctx,x,y,cw,ch,14);ctx.stroke();
    ctx.fillStyle='rgba(20,31,25,.72)';roundRect(ctx,x+8,y+ch-32,slots[i][1].length*20+18,24,12);ctx.fill();
    ctx.fillStyle='#ffcf3f';ctx.textAlign='left';ctx.font='600 17px system-ui';
    ctx.fillText(slots[i][1],x+16,y+ch-15);ctx.textAlign='center';
  }
  const footY=top+3*(ch+gap)+52;
  ctx.fillStyle='#2f4a3d';ctx.font='700 32px '+RFONT;
  ctx.fillText('探險家　'+(S.codename||'平溪小旅人'),W/2,footY);
  ctx.fillStyle='#8a7a55';ctx.font='500 20px system-ui';
  const d=new Date();const ds=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
  ctx.fillText('平溪囝仔認證　·　'+ds,W/2,footY+34);
}
function fillEmpty(ctx,x,y,w,h){
  const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'#3f6151');g.addColorStop(1,'#1d3128');
  ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(244,239,224,.5)';ctx.textAlign='center';ctx.font='500 18px system-ui';
  ctx.fillText('（未拍照）',x+w/2,y+h/2+6);
}
function downloadPostcard(){
  const c=document.getElementById('postcard');
  try{const a=document.createElement('a');a.download='平溪明信片_'+(S.codename||'探險家')+'.jpg';
    a.href=c.toDataURL('image/jpeg',0.92);a.click();}
  catch(e){alert('儲存失敗，請改用長按圖片另存');}
}

function restart(){ if(confirm('確定要清除進度、重新開始嗎？')){S=fresh();save();location.reload();} }

/* ---------- 啟動 ---------- */
(function init(){
  const ci=document.getElementById('coverImg');ci.src=SCENE_IMG[1];
  ci.onerror=()=>{ci.style.display='none';document.querySelector('.cover-hero').style.background='linear-gradient(160deg,#3f6151,#1d3128)';};
  if(S.done){document.querySelector('#cover .cover-body p').innerHTML='你已完成旅程！可回顧你的平溪小小遊記與明信片，或重新開始。';
    document.querySelector('#cover .cta').textContent='查看小小遊記 📖';
    document.querySelector('#cover .cta').setAttribute('onclick',"go('finale')");}
  else if(S.stage>1){document.querySelector('#cover .cta').textContent='繼續走讀（第 '+S.stage+' 關）→';}
})();
</script>
